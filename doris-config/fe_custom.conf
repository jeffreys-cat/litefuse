# Doris FE Custom Configuration
# This file will be loaded by Doris FE on startup

# Disable backend blacklist to prevent BE nodes from being marked as unavailable
# This is useful in development/test environments where BE might have temporary connection issues
disable_backend_black_list = true


# --- EO label protection (2026-07-28 duplicate-data incident) ---
# Stream load labels are retained by THIS knob (not label_keep_max_second);
# default 43200 (12h) is shorter than the DLQ age guard (3d) and would strip
# label protection from redrives older than 12h.
streaming_label_keep_max_second = 259200
# Count-bounded label registry (default 2000) evicted labels after ~15min
# under load. Size: total txn rate x 3d x 1.5 margin. Costs FE heap
# (~0.5-1GB at 1M) — keep JVM -Xmx headroom in mind.
label_num_threshold = 1000000
